<!DOCTYPE html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Admin | Banco RPG</title><link rel="stylesheet" href="/styles.css" /></head>
  <body>
    <div class="page">
      <div class="topbar"><a class="brand" href="/">🏦 Banco RPG</a><nav class="nav-links"><a class="nav-pill" href="/dashboard">Painel</a><a class="nav-pill active" href="/admin">Admin</a></nav></div>
      <section class="grid">
        <article class="card">
          <h3>Depósito administrativo</h3>
          <div id="notice" class="notice hidden"></div>
          <form id="deposit-form">
            <label>Token administrativo</label><input name="admin_token" required />
            <label>ID do membro</label><input name="member_id" type="number" required />
            <label>Valor do depósito</label><input name="amount" type="number" step="0.01" required />
            <button type="submit">Creditar saldo</button>
          </form>
        </article>
        <article class="card">
          <h3>Novo cargo</h3>
          <form id="role-form">
            <label>Token administrativo</label><input name="admin_token" required />
            <label>Órgão</label><select id="organization-select" name="organization_id"></select>
            <label>Nome do cargo</label><input name="name" required />
            <label>Salário base</label><input name="base_salary" type="number" step="0.01" required />
            <button class="secondary" type="submit">Criar cargo</button>
          </form>
        </article>
      </section>
    </div>
    <script src="/common.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
